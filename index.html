<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>용병단 — Mercenary Company</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314110e'/%3E%3Cpath d='M16 4l3 15-3 9-3-9z' fill='%23c8a24a'/%3E%3Crect x='10' y='18' width='12' height='2.5' fill='%238d7a4a'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">
  <!-- ── top bar ─────────────────────────────────────────────── -->
  <header id="topbar">
    <div class="brand">용병단</div>
    <div id="round-info"><span class="label">라운드</span> <b id="round-num">1</b></div>
    <div id="turn-order" class="turn-order"></div>
    <div class="top-actions">
      <button id="btn-newbattle" class="btn ghost" title="새 전투 생성">새 전투</button>
      <button id="btn-help" class="btn ghost" title="도움말">?</button>
    </div>
  </header>

  <!-- ── main area ───────────────────────────────────────────── -->
  <main id="stage">
    <canvas id="board"></canvas>

    <aside id="panel-left" class="panel">
      <div id="unit-card" class="unit-card empty">유닛을 선택하세요</div>
    </aside>

    <aside id="panel-right" class="panel">
      <div class="panel-title">전투 기록</div>
      <div id="log" class="log"></div>
    </aside>

    <div id="hover-tip" class="tip hidden"></div>
    <div id="banner" class="banner hidden"></div>
  </main>

  <!-- ── action bar ──────────────────────────────────────────── -->
  <footer id="actionbar">
    <div id="ap-fatigue" class="resource-block"></div>
    <div id="skills" class="skills"></div>
    <div class="turn-buttons">
      <button id="btn-wait" class="btn">대기 <kbd>Q</kbd></button>
      <button id="btn-end" class="btn primary">턴 종료 <kbd>Space</kbd></button>
    </div>
  </footer>
</div>

<!-- ── modal ──────────────────────────────────────────────────── -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-ok" class="btn primary">확인</button>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
