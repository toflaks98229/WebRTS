<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>용병단 — Mercenary Company</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314110e'/%3E%3Cpath d='M16 4l3 15-3 9-3-9z' fill='%23c8a24a'/%3E%3Crect x='10' y='18' width='12' height='2.5' fill='%238d7a4a'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app" class="mode-campaign">
  <!-- ── top bar ─────────────────────────────────────────────── -->
  <header id="topbar">
    <div class="brand">용병단</div>

    <!-- campaign -->
    <div id="date-info" class="campaign-only">
      <span class="label">일차</span> <b id="day-num">1</b>
      <span id="clock" class="clock">06:00</span>
    </div>
    <div id="speed-controls" class="campaign-only seg">
      <button class="seg-btn" data-speed="0" title="정지">❚❚</button>
      <button class="seg-btn active" data-speed="1" title="보통">▶</button>
      <button class="seg-btn" data-speed="3" title="빠름">▶▶</button>
    </div>
    <div id="world-status" class="campaign-only grow"></div>

    <!-- battle -->
    <div id="round-info" class="battle-only"><span class="label">라운드</span> <b id="round-num">1</b></div>
    <div id="turn-order" class="battle-only turn-order"></div>

    <!-- lab -->
    <div id="lab-info" class="lab-only grow"></div>

    <div class="top-actions">
      <button id="btn-lab" class="btn ghost" title="유닛 배치 실험실 (L)">실험실</button>
      <button id="btn-help" class="btn ghost" title="도움말">?</button>
    </div>
  </header>

  <!-- ── main area ───────────────────────────────────────────── -->
  <main id="stage">
    <canvas id="board"></canvas>

    <aside id="panel-left" class="panel">
      <div id="unit-card" class="unit-card empty battle-only">유닛을 선택하세요</div>
      <div id="company-card" class="company-card campaign-only"></div>
      <div id="lab-palette" class="company-card lab-only"></div>
    </aside>

    <aside id="panel-right" class="panel">
      <div class="panel-title">
        <span class="battle-only">전투 기록</span>
        <span class="campaign-only">여정 기록</span>
        <span class="lab-only">실험실</span>
      </div>
      <div id="log" class="log battle-only"></div>
      <div id="world-log" class="log campaign-only"></div>
      <div id="lab-notes" class="log lab-only">
        <p>배치한 그대로 전투가 열린다. 캠페인 상태는 건드리지 않는다.</p>
        <p><b>좌클릭</b> 배치 · <b>우클릭</b> 제거</p>
        <p><b>Space</b> 전투 시작 · <b>R</b> 지형 재생성 · <b>Esc</b> 지도로</p>
        <p>레벨 슬라이더는 특성 점수만 올린다. 능력치는 그대로 두어 특성 효과만 따로 비교할 수 있다.</p>
      </div>
    </aside>

    <div id="hover-tip" class="tip hidden"></div>
    <div id="banner" class="banner hidden"></div>
  </main>

  <!-- ── action bar ──────────────────────────────────────────── -->
  <footer id="actionbar">
    <!-- battle -->
    <div id="ap-fatigue" class="resource-block battle-only"></div>
    <div id="skills" class="skills battle-only"></div>
    <div class="turn-buttons battle-only">
      <button id="btn-wait" class="btn">대기 <kbd>Q</kbd></button>
      <button id="btn-end" class="btn primary">턴 종료 <kbd>Space</kbd></button>
    </div>

    <!-- campaign -->
    <div id="world-hint" class="campaign-only world-hint"></div>
    <div id="world-actions" class="campaign-only world-actions"></div>

    <!-- lab -->
    <div id="lab-hint" class="lab-only world-hint"></div>
    <div id="lab-actions" class="lab-only world-actions"></div>
  </footer>
</div>

<!-- ── modal ──────────────────────────────────────────────────── -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-ok" class="btn primary">확인</button>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
